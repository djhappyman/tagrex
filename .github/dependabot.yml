# Proposes dependency updates as pull requests (#712). Nothing merges by itself.
# Monthly and grouped, so a tree of this size stays one reviewable change.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # beat-this pins the rten version, so these can only move when it does
    # (#716). Security updates are not affected by this list.
    ignore:
      - dependency-name: "rten"
      - dependency-name: "rten-tensor"
      # windows-future 0.100 already belongs to the next windows-rs generation
      # while the windows crate (used by the app, tao and cpal) has no matching
      # release yet, so the group below would offer it alone and it would not
      # compile (#756). Bump it by hand together with the windows crate.
      - dependency-name: "windows-future"
    groups:
      # windows-future must match the windows crate's core types, so a bump of
      # either one alone does not compile (#716). Listed first because a
      # dependency joins the first group that matches it.
      windows-crates:
        patterns: ["windows", "windows-*"]
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

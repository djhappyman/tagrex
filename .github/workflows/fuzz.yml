name: Fuzz

# Coverage-guided fuzzing of the tag read/write paths, the cover resize and the
# player's decode path (#719). A finding is a property of the code, not of the
# commit that happens to be on main, so this runs on a schedule in a workflow of
# its own instead of turning CI red on an unrelated change. The corpus each
# target has grown is kept in the Actions cache, so every run starts where the
# last one stopped. A crashing input is uploaded as an artifact; replay it with
# `fuzz/examples/replay.rs` (see fuzz/README.md).
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "1200"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [tag_read, tag_write, cover_resize, player_decode]
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      # The player links the system audio library through rodio.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # The fuzz crate resolves against the app's own lockfile, so it fuzzes
      # the dependency versions the app ships with.
      - name: Use the workspace lockfile
        run: cp Cargo.lock fuzz/Cargo.lock

      - name: Restore the corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # Release mode without overflow checks, as the app is built: an overflow
      # that only a debug build turns into a panic is not what users meet.
      - name: Fuzz
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run -O ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds -- \
            -max_total_time=${{ inputs.seconds || '1200' }} \
            -timeout=10 -rss_limit_mb=4096

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      # Keep only the inputs that add coverage, so the cache does not grow
      # without end. Skipped after a crash, when the run stopped early anyway.
      - name: Minimize the corpus
        if: success()
        run: cargo fuzz cmin -O ${{ matrix.target }} fuzz/corpus/${{ matrix.target }}

      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

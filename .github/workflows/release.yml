name: Release build

# Builds the desktop app on native runners per OS, because cross-compiling Tauri
# from one platform to another isn't practical — each needs its own webview +
# linker. Coverage: macOS as one universal app for Apple Silicon and Intel
# (#509), built on the Apple Silicon runner, which compiles both halves;
# Windows and Linux on both ARM64 and x86-64. All of these runners are free for
# public repos.
#
# Called by Build and release after reusable CI validation. Main commits produce
# artifacts; personal tags
# also attach a complete successful matrix to a personal pre-release.

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # only used by the tag-triggered release step

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, pinned (#508): macos-14 is retired on 2026-11-02, and
          # macos-latest would move to a new image without a commit saying so.
          # One universal app (#509): the Apple Silicon runner builds the Intel
          # half too, so Intel Macs need no runner of their own.
          - name: macos-universal
            runner: macos-15
            # Native app bundle plus a disk image; no updater archive.
            bundles: app,dmg
            target: universal-apple-darwin
          # ARM64
          - name: windows-arm64
            runner: windows-11-arm
            bundles: nsis
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            bundles: deb,rpm
          # x86-64
          - name: windows-x64
            runner: windows-latest
            bundles: nsis
          - name: linux-x64
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check personal release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e 'const c=require("./app/tauri.conf.json"); if(process.env.GITHUB_REF_NAME !== "personal-v"+c.version) throw new Error("Release tag must match app version");'
      - run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The universal macOS app needs the Intel half's standard library too.
      - name: Add the Intel macOS target
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Same GTK/WebKit/audio system libraries the Linux CI build needs; the
      # runner doesn't ship them.
      - name: Install Tauri Linux system dependencies
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Personal builds have no updater service or updater signing key.
      - name: Build the app bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- --locked

      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tagrex-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage


  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/personal-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download complete package matrix
        uses: actions/download-artifact@v8
        with:
          pattern: tagrex-*
          path: bundles
      # The release page's text is the changelog's own section for this version
      # (#261). The file already says what changed, in the words it was written
      # in; without this the most visible page in the project is a list of files
      # and nothing else. `shell: bash` because this runs on the Windows runners
      # too, where the default shell is PowerShell.
      - name: Take the release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#personal-v}"
          # The changelog wraps at 80 columns, and a release description takes
          # every newline as a line break (#598), so each paragraph and list item
          # is joined back into one line on the way out.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md | awk '
            function flush() { if (buf != "") { print buf; buf = "" } }
            /^[[:space:]]*$/ { flush(); print; next }
            /^#/ { flush(); print; next }
            /^[[:space:]]*([-*] |[0-9]+\. )/ { flush(); buf = $0; next }
            { line = $0; sub(/^[[:space:]]+/, "", line); buf = (buf == "") ? line : buf " " line }
            END { flush() }
          ' > RELEASE_NOTES.md
          # A version with no section says so, rather than the page silently
          # going out empty again.
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See CHANGELOG.md for what changed in $version." > RELEASE_NOTES.md
          fi

      - name: Attach verified matrix to personal pre-release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            bundles/**/*.dmg
            bundles/**/*.exe
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.AppImage

name: Release build

# Builds the desktop app on native runners per OS, because cross-compiling Tauri
# from one platform to another isn't practical — each needs its own webview +
# linker. Coverage: macOS as one universal app for Apple Silicon and Intel
# (#509), built on the Apple Silicon runner, which compiles both halves;
# Windows and Linux on both ARM64 and x86-64. All of these runners are free for
# public repos.
#
# Called by Build and release after reusable CI validation. Main commits produce
# artifacts; personal tags
# also attach a complete successful matrix to a personal pre-release.

on:
  workflow_call:
    inputs:
      publish_release:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check fork, version and release destination
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: node tools/personal-release.mjs plan

  build:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, pinned (#508): macos-14 is retired on 2026-11-02, and
          # macos-latest would move to a new image without a commit saying so.
          # One universal app (#509): the Apple Silicon runner builds the Intel
          # half too, so Intel Macs need no runner of their own.
          - name: macos-universal
            runner: macos-15
            # Native app bundle plus a disk image; no updater archive.
            bundles: app,dmg
            target: universal-apple-darwin
          # ARM64
          - name: windows-arm64
            runner: windows-11-arm
            bundles: nsis
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            bundles: deb,rpm
          # x86-64
          - name: windows-x64
            runner: windows-latest
            bundles: nsis
          - name: linux-x64
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The universal macOS app needs the Intel half's standard library too.
      - name: Add the Intel macOS target
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Same GTK/WebKit/audio system libraries the Linux CI build needs; the
      # runner doesn't ship them.
      - name: Install Tauri Linux system dependencies
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Personal builds have no updater service or updater signing key.
      - name: Build the app bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- --locked

      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tagrex-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage


  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download complete package matrix
        uses: actions/download-artifact@v8
        with:
          pattern: tagrex-*
          path: bundles
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify all packages and publish a complete personal prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: "true"
        run: node tools/personal-release.mjs publish bundles

name: Build and release

# PRs run CI directly. Main commits and personal releases reuse the same checks,
# then build packages, so there is no deliberately skipped package check on PRs.
on:
  push:
    branches: [main]
    tags: ["personal-v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  packages:
    needs: validation
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

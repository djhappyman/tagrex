name: Build and release

# PRs run CI directly. Main commits and personal releases reuse the same checks,
# then build packages, so there is no deliberately skipped package check on PRs.
on:
  push:
    branches: [main]
    tags: ["personal-v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a new personal prerelease after all packages pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    if: github.repository == 'djhappyman/tagrex'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  packages:
    if: github.repository == 'djhappyman/tagrex'
    needs: validation
    uses: ./.github/workflows/release.yml
    with:
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || startsWith(github.ref, 'refs/tags/personal-v') }}
    permissions:
      contents: write

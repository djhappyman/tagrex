[package]
name = "tagrex-core"
description = "TagRex core: tag model, bidirectional masks, transforms, transactional change pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Cover art resize/recompress (#41). Only the two cover formats we handle, to
# keep the dependency and build lean.
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png"] }
# FileLike::splice (0.25.4, still so in 0.25.5) cuts a file to the wrong length
# when a shrinking edit ends at EOF (lofty-rs#731). Only a file with no audio after its tags can
# hit that, and model.rs refuses to write such a file before lofty sees it
# (`ensure_audio_after_tags`, #416).
lofty = "0.25.5"
regex = "1.13.1"
# Reads an oversized PNG cover row by row, so shrinking it never holds the full
# decoded image (#622). Already in the tree via image.
png = "0.18.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Tells a case-only rename of one file from a move onto another file on a
# case-insensitive file system (#604, #605). Already in the tree via walkdir.
same-file = "1.0.6"
thiserror.workspace = true
walkdir = "2.5.0"
